name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  linux-tests:
    name: tests / linux / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [lint, unit, blockchain, claims, datanetwork, other, takeovers, transactions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Elasticsearch mmap limit
        if: matrix.suite != 'lint' && matrix.suite != 'unit'
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Run baseline suite
        env:
          SUITE: ${{ matrix.suite }}
          TEST_OUTPUT_DIR: ci-results
          TEST_TIMEOUT: '1800'
        run: |
          case "$SUITE" in
            lint|unit) sh scripts/test.sh "$SUITE" ;;
            *) sh scripts/test.sh integration "$SUITE" ;;
          esac
      - name: Upload logs and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-linux-${{ matrix.suite }}
          path: ci-results/
          retention-days: 14

  native:
    name: tests and build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-15-intel
            platform: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
          python-version: '3.9.25'
          python-arch: x86_64
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            setup.py
            docker/test-constraints.txt
            docker/build-requirements.txt
      - name: Install baseline dependencies
        run: |
          uv pip install -c docker/test-constraints.txt pip setuptools wheel Cython
          python -m pip install --no-build-isolation -c docker/test-constraints.txt -r docker/build-requirements.txt -e '.[test]'
          python -m pip check
          mkdir -p ci-results
          python -m pip freeze > ci-results/packages.txt
      - name: Test configuration
        run: |
          python -m coverage run --source=lbry -m unittest -v tests.unit.test_conf 2>&1 | tee ci-results/config-tests.log
      - name: Test full wallet suite
        run: |
          python -m coverage run --append --source=lbry -m unittest discover -v tests.unit.wallet 2>&1 | tee ci-results/wallet-tests.log
      - name: Write coverage report
        if: always()
        run: python -m coverage xml -o ci-results/coverage.xml
      - name: Build macOS binary
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --onefile --name lbrynet lbry/extras/cli.py
          dist/lbrynet --version
      - name: Build Windows binary
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --additional-hooks-dir=scripts --icon=icons/lbry256.ico --onefile --name lbrynet lbry/extras/cli.py
          dist/lbrynet.exe --version
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lbrynet-${{ matrix.platform }}
          path: dist/lbrynet*
          if-no-files-found: error
          retention-days: 14
      - name: Upload logs and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.platform }}
          path: ci-results/
          retention-days: 14

  build-linux:
    name: build / linux
    needs: [linux-tests, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check binary
        env:
          TEST_OUTPUT_DIR: ci-results
          TEST_TIMEOUT: '1200'
        run: sh scripts/test.sh build
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lbrynet-linux
          path: ci-results/lbrynet
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-linux-build
          path: |
            ci-results/test.log
            ci-results/packages.txt
          retention-days: 14
